# Machine-checkable thresholds for the slide pipeline.
#
# The theory these numbers implement is in .claude/reference/slide_design_rules.md.
# Edit here, not in the scripts.
#
# Severity convention (deliberate): only mechanical, unambiguous defects are errors.
# Everything requiring judgement is a warning, because a linter that blocks a render
# on a false positive is a linter that gets switched off.

headline:
  min_words: 4          # warn: a 1-3 word headline is a topic label, not an assertion
  max_words: 16         # warn: an assertion longer than this is a paragraph
  require_terminal_punctuation: true   # warn: house style — assertions end in . ! ?
  # Generic titles banned outright by the Assertion-Evidence model. Course language
  # is Italian (LOGISTICS), so the list is Italian first, English second.
  banned_titles:
    - introduzione
    - panoramica
    - agenda
    - obiettivi
    - conclusioni
    - conclusione
    - domande
    - riepilogo
    - indice
    - sommario
    - contesto
    - overview
    - introduction
    - objectives
    - summary
    - questions
    - results
    - risultati

# The licensed exception to "no bullet lists" (Assertion-Evidence). A list is allowed
# only for intrinsically enumerable or ordered content, and only within these bounds.
lists:
  max_items: 5
  max_words_per_item: 8
  allow_nesting: false
  require_justification: true   # error: the model must state why this content IS a list
  ban_sentences: true           # warn: an item ending in '.' is prose, not a list item

slide:
  max_words_total: 60           # warn: headline + body text, per Cognitive Load Theory
  max_code_lines: 12            # warn: beyond this it is a handout, not a slide

notes:
  required_fields: [talk, why_here, links, watch_for, timing_min]  # error if missing/empty
  min_talk_words: 25            # warn
  # Redundancy KPI (Mayer). novelty = share of note tokens absent from the slide text.
  # A low score means the notes just re-read the slide aloud.
  min_novelty: 0.50             # warn
  novelty_min_tokens: 12        # below this the ratio is statistical noise — skip scoring

timing:
  # Slides are not the whole unit. A hands-on unit spends most of its minutes in the
  # lab and the debrief, so this check is deliberately one-sided: it catches slides
  # crowding out the practice, never a unit having "too few" slides.
  max_share_of_unit: 0.60       # warn: slide minutes above this share of a hands-on unit
  session_tolerance_pct: 15     # warn: total slide minutes above the session budget

# Kolb cycle completeness: every hands-on unit must carry all four stages.
# Set `kolb_exempt: true` on a unit to opt out (and say why in the unit's `note`).
kolb:
  required_roles: [problem, debrief, concept, apply]

# Two-lane design mandated by design/curriculum.md §4 for every hands-on unit:
# the dev pair and the ops pair each need a stated role in a lab.
lanes:
  require_both_lanes_per_unit: true   # warn if a unit's lab-briefs never address ops
  valid: [both, dev, ops]

roles:
  # Roles an author may write. `title`, `section` and `attribution` slides are
  # generated by build_deck.py and must not be authored by hand.
  authorable: [vocab, problem, lab-brief, debrief, concept, apply, menu, homework, recap]
  generated: [title, section, attribution]

images:
  # Fetched images are a legal artefact, not just an asset: these fields are hard errors.
  required_fields: [license, attribution, alt]
  # Sources allowed for fetched raster images. Anything else must be a local asset
  # supplied by a human, or a placeholder.
  allowed_hosts:
    - upload.wikimedia.org
    - commons.wikimedia.org
    - docs.spring.io
    - spring.io
    - learn.microsoft.com
    - cloud.google.com
    - kubernetes.io
    - opentelemetry.io
    - raw.githubusercontent.com
