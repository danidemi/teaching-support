# Self-test fixture for the slide pipeline — NOT course material.
#
# It exercises every body kind that does not need the network (diagram, list, code,
# callout, placeholder, links) plus notes, lanes and the Kolb role skeleton, and it
# is written to pass `slides lint` cleanly. If a change to the scripts breaks
# something, this is the fastest place to see it:
#
#     tools/slides/slides check   tools/slides/example/fixture.yml
#     tools/slides/slides preview tools/slides/example/fixture.yml
#
# The full model format is documented in .claude/reference/slide_model_spec.md.

deck: 1
status: draft
language: it
course: "Fixture — pipeline self-test"
session: 1
title: "Fixture di prova della pipeline"
subtitle: "Non è materiale didattico"

sources:
  curriculum: design/curriculum.md
  goals: specifications/goals.md
  logistics: specifications/logistics.md
  read_at: 2026-07-28

budget:
  session_minutes: 60
  slide_budget: [4, 12]

units:
  - unit: "1.1"
    title: "Unità di prova"
    minutes: 55
    slides:
      - id: FIX-01
        role: problem
        lane: both
        goals: [G1]
        headline: "Un gateway non raggiungibile blocca l'intera migrazione."
        provenance: stated
        body:
          kind: callout
          text: "Il cluster è pronto, l'immagine esiste, nessuno riesce a chiamare il servizio."
        notes:
          talk: |
            Aprire con il fatto scomodo: finché nessuno raggiunge il gateway dall'esterno,
            tutto il lavoro fatto sul cluster è invisibile al cliente. Non spiegare ancora
            il perché tecnico, serve solo creare la domanda a cui l'unità risponde.
          why_here: |
            Apre il ciclo esperienziale con un problema concreto prima di qualsiasi teoria.
          links: |
            Riprende il vocabolario condiviso, anticipa la deploy.
          watch_for: |
            La coppia ops tende a saltare subito alla soluzione: rimandare.
          timing_min: 5

      - id: FIX-02
        role: lab-brief
        lane: both
        goals: [G1]
        headline: "Il vostro compito è rendere il pod raggiungibile in quindici minuti."
        provenance: stated
        body:
          kind: list
          ordered: true
          justification: >-
            Procedura operativa da eseguire in ordine: ogni passo dipende dal precedente,
            quindi è intrinsecamente sequenziale e non riducibile a un diagramma.
          items:
            - "Applicare il Deployment"
            - "Esporre il Service"
            - "Verificare la readiness probe"
            - "Chiamare l'endpoint dall'esterno"
        links:
          - label: "Documentazione Spring Cloud Gateway"
            url: "https://docs.spring.io/spring-cloud-gateway/reference/"
        notes:
          talk: |
            Assegnare le corsie ad alta voce prima di far partire il timer, altrimenti
            i quattro partecipanti si sovrappongono sullo stesso passo. Tenere il tempo
            visibile: il vincolo temporale è parte dell'esercizio, non un dettaglio.
          why_here: |
            Prima esperienza concreta; il fallimento parziale qui alimenta il debriefing.
          links: |
            Prepara la formalizzazione del modello di deploy che arriva dopo.
          watch_for: |
            Chi finisce presto va messo a supportare l'altra corsia, non ad aggiungere extra.
          timing_min: 6

      - id: FIX-03
        role: debrief
        lane: both
        goals: [G1]
        headline: "Quasi sempre il blocco è il Service, non l'immagine."
        provenance: inferred
        body:
          kind: list
          justification: >-
            Elenco di domande di debriefing: sono voci parallele e indipendenti, non un
            discorso continuo, e vengono lette una alla volta ad alta voce.
          items:
            - "Cosa si è rotto per primo?"
            - "Come lo avete capito?"
            - "Cosa cambiereste ora?"
        notes:
          talk: |
            Far parlare prima chi ha incontrato l'errore, non chi ha trovato la soluzione.
            Raccogliere le cause reali alla lavagna condivisa senza correggerle subito:
            servono come materiale per la fase teorica successiva.
          why_here: |
            La riflessione è lo stadio che più spesso viene saltato ed è quello che
            trasforma l'attività in apprendimento.
          links: |
            Le cause raccolte qui vengono riprese una per una nella parte teorica.
          watch_for: |
            Rischio che diventi una sessione di soluzioni: riportare sulle cause.
          timing_min: 5

      - id: FIX-04
        role: concept
        lane: both
        goals: [G1]
        headline: "Il traffico attraversa Service e probe prima di arrivare al pod."
        provenance: stated
        body:
          kind: diagram
          caption: "Percorso di una richiesta"
          mermaid: |
            flowchart LR
              C[Client] --> S[Service]
              S --> P{Readiness<br/>probe}
              P -- pronta --> G[Pod gateway]
              P -- non pronta --> X[Nessun instradamento]
        notes:
          talk: |
            Percorrere il diagramma nell'ordine in cui la richiesta viaggia, fermandosi
            sul ramo della probe: è lì che finivano gli errori raccolti nel debriefing.
            Collegare ogni nodo a un errore realmente visto pochi minuti prima.
          why_here: |
            Fornisce il principio che spiega ciò che i partecipanti hanno già osservato.
          links: |
            Chiude gli errori del debriefing, apre la modifica di configurazione seguente.
          watch_for: |
            Per la coppia sviluppo il ramo negativo della probe è il punto meno intuitivo.
          timing_min: 5

      - id: FIX-05
        role: apply
        lane: dev
        goals: [G1]
        headline: "Una probe corretta cambia il comportamento in modo osservabile."
        provenance: inferred
        body:
          kind: code
          lang: yaml
          caption: "Modifica da applicare e ridistribuire"
          text: |
            readinessProbe:
              httpGet:
                path: /actuator/health/readiness
                port: 8080
              initialDelaySeconds: 5
        notes:
          talk: |
            Chiedere una previsione prima di applicare la modifica: cosa cambierà nella
            risposta osservata? Poi ridistribuire e confrontare la previsione con il
            risultato reale, che è il passaggio che consolida il principio appena visto.
          why_here: |
            Sperimentazione attiva sullo stesso ambiente, a complessità leggermente maggiore.
          links: |
            Diventa l'esperienza concreta di apertura dell'unità successiva.
          watch_for: |
            Senza previsione dichiarata prima, il confronto perde valore formativo.
          timing_min: 4

      - id: FIX-06
        role: recap
        lane: both
        goals: [G1]
        headline: "Placeholder di prova per un'immagine che deve fornire un umano."
        provenance: invented
        body:
          kind: placeholder
          needs: "Screenshot della console GKE con il workload in stato Running"
          why: >-
            Non è recuperabile dalla rete: è l'ambiente del cliente e va catturato
            durante la preparazione della sessione.
        notes:
          talk: |
            Mostrare la console reale del cliente chiude il cerchio: il partecipante
            riconosce lo strumento che userà davvero al lavoro, non un esempio generico
            costruito per l'aula. Chiedere a entrambe le corsie di confermare a voce che
            vedono lo stesso stato prima di chiudere il blocco e andare in pausa.
          why_here: |
            Verifica finale condivisa fra le due corsie prima della pausa.
          links: |
            Riprende il compito iniziale e ne mostra il risultato raggiunto.
          watch_for: |
            Se lo screenshot manca, sostituire con una condivisione schermo dal vivo.
          timing_min: 3
