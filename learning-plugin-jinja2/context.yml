# Single source of truth for names/paths repeated across template/*.
#
# render.py loads this file and passes every top-level key to Jinja2 as a
# template variable (Environment uses StrictUndefined: a template that
# references a key not defined here fails to render, instead of silently
# producing an empty string).
#
# Partial convention: a file or directory under template/ whose name starts
# with `_` (e.g. template/agents/_agent_base.md) is library-only content,
# reachable via {% extends %}/{% include %} but never rendered to its own
# output file — render.py skips any such path in its output walk. Nothing to
# register here; it's a naming convention, not a list to keep in sync.

# The SSOT stores, canonical list in reference/ssot_structure.md. Paths are
# relative to the plugin's project root (what ssot_structure.md calls
# <ROOT>), matching how they are written in the templates.
stores:
  logistics:
    name: LOGISTICS
    path: specifications/logistics.md
  student_personas:
    name: STUDENT_PERSONAS
    path: specifications/student_personas.md
  goals:
    name: GOALS
    path: specifications/goals.md
  design:
    name: DESIGN
    path: design/knowledge_goals_graph.json
  curriculum:
    name: CURRICULUM
    path: design/curriculum.json
  editorial_guidelines:
    name: EDITORIAL_GUIDELINES
    path: specifications/editorial_guidelines.md

references:
  design_schema:
    path: reference/knowledge_goals_graph.schema.json
  curriculum_schema:
    path: reference/curriculum.schema.json
  ssot_structure:
    path: reference/ssot_structure.md
  didactic_material_catalog:
    path: reference/material_catalog.md

didactic_activities:
  lecture:
    name: lecture
  demo:
    name: demo
  group_discussion:
    name: group_discussion
  hands_on:
    name: hands_on
  project:
    name: project
  prerequisite_assessment_quiz:
    name: prerequisite_assessment_quiz
  feedback_assessment_quiz:
    name: feedback_assessment_quiz
  learning_assessment_quiz:
    name: learning_assessment_quiz
  summative_assessment_quiz:
    name: summative_assessment_quiz

didactic_material:
  - type: slides
    audience: Students and Trainer
    preferred_formats: "YAML deck model (`reference/deck_model_spec.md`); a human renders an approved model to PowerPoint/PDF separately, via `tools/slides/render_deck.py`"
    owning_subagent: learning-author-slide
    trigger: One per session, learner-facing content only, used by trainer
    path_pattern: "`material/slides/`"
    filename_pattern: "`session-NN.yml`"
  - type: student book
    audience: Student
    preferred_formats: AsciiDoc, PDF
    owning_subagent: currently generated by hand by human
    trigger: One per whole course, explains all the concepts to the learner as a typical school book would do
    path_pattern: "`material/student/books/`"
    filename_pattern: "`student-book.adoc` or `student-book.pdf`"
  - type: quiz
    audience: Student
    preferred_formats: Markdown
    owning_subagent: currently generated by hand by human
    trigger: Used in the curriculum to gain a feedback about the learning progress, be it for evaluation or simply to better understand how well the students are learning.
    path_pattern: "`material/teacher/quizzes/`"
    filename_pattern: "`quiz-<TYPE_OF_QUIZ>-<PROGRESS>.md`"
